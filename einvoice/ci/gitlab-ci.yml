# Copy-paste CI gate for GitLab CI: fail the pipeline if any invoice is not
# XRechnung/EN 16931 conformant (against the validator's IMPLEMENTED rules —
# see README.md §2 for the honest coverage). The failing rule ID (e.g.
# BR-DE-15) is printed in the job log.
#
# It drives the real conformance-report entrypoint `python3 -m einvoice.report`
# (exit 0 = no fatal, non-zero = fatal) and writes a per-invoice JUnit XML into
# einvoice-junit/, wired below as GitLab's `artifacts:reports:junit` so each
# fatal rule renders in the pipeline's Tests tab.
#
# Install: merge this job into your .gitlab-ci.yml and put invoices under
# invoices/. The released distribution is on PyPI as `verifyhash-einvoice`, so
# the install step can simply be:
#     - python3 -m pip install verifyhash-einvoice
# (mind the name: the bare `einvoice` project on PyPI is unrelated).
#
# This template vendors the einvoice product directory at third_party/einvoice/
# and installs that copy instead, because it also works on air-gapped runners
# and pins the exact validated tree in your repo. See ci/README.md.

invoice-conformance:
  image: python:3.12-alpine
  variables:
    EINVOICE_PROFILE: "xrechnung"   # or: en16931 (core rules only)
    EINVOICE_RESULTS_DIR: "einvoice-junit"
  script:
    - python3 -m pip install ./third_party/einvoice
    - sh third_party/einvoice/ci/validate-invoices.sh invoices/
  artifacts:
    when: always
    paths:
      - einvoice-junit/
    reports:
      junit: einvoice-junit/*.junit.xml

# Adoption on-ramp (T-VH.22): to gate only on NEW regressions vs a captured
# baseline (tolerating a pre-existing backlog), drive
# `einvoice validate --baseline` per invoice instead of this hard gate:
#   einvoice validate --profile xrechnung --json invoices/x.xml > baseline.json
#   einvoice validate --profile xrechnung --baseline baseline.json invoices/x.xml
# (--baseline exits 1 only on a new fatal; pre-existing fatals are tolerated.)
# Run the FIRST line once locally and commit baseline.json; only the second line
# belongs in the pipeline. The capture exits 1 when the corpus already has
# fatals — that is the backlog you are baselining, not an error.
# Pass the SAME --profile on both lines, matching EINVOICE_PROFILE above:
# xrechnung is en16931 plus the BR-DE-* layer, so a cross-profile diff scores a
# flag change as a regression. Since 2026-07-29 that is refused outright (exit 2,
# nothing on stdout) whenever the baseline records the profile it was captured
# under. A baseline written by `einvoice validate --json` does NOT record one
# yet, so the gate instead prints one `note:` line on stderr each run saying the
# profile could not be checked — expect it; it is not a failure. Capture with
# `python3 -m einvoice.report --profile xrechnung --format json` for the hard
# check instead of the note.
