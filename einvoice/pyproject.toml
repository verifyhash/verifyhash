# Packaging for the einvoice validator. Deliberately minimal:
#   * ZERO runtime dependencies (stdlib only) — `dependencies = []` is a
#     contract, enforced by test_packaging.py.
#   * one console script: `einvoice` -> einvoice.cli:main (the same entry
#     point as `python3 -m einvoice` and the source-checkout `einvoice.py`).
#   * ships ONLY the `einvoice` package — the multi-hundred-MB rule corpus,
#     differential harness and test vectors stay in the repo, not the wheel.
#
# Published to PyPI as `verifyhash-einvoice` since 0.2.0 (2026-07-22);
# republishing stays a human-gated step (see REPUBLISH-PYPI.md). Also
# installable from a checkout:  python3 -m pip install /path/to/einvoice

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyhash-einvoice"
version = "0.2.6"
description = "Zero-dependency EN 16931 / XRechnung (UBL + CII) e-invoice conformance validator — 297 business rules including the national BR-DE and BR-DEX CIUS/extension layers, each differential-tested to 0 divergences against the official Schematron within the implemented set; every fireable BR-CL-* code-list check is now implemented in both syntaxes; see CORRECTNESS.md for the honest remaining scope."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# ZERO runtime dependencies — the whole point. Do not add any.
dependencies = []

[project.urls]
Homepage = "https://github.com/verifyhash/verifyhash"

[project.scripts]
einvoice = "einvoice.cli:main"

[tool.setuptools]
# Explicit: ship the pure-Python package only (never corpus/, ci/, tests).
packages = ["einvoice"]

[tool.setuptools.package-data]
# PEP 561: ship the `py.typed` marker so the embedded type hints are honoured
# by downstream type checkers (mypy/pyright) when einvoice is vendored/installed.
einvoice = ["py.typed"]
