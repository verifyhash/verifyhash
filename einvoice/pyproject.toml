# Packaging for the einvoice validator. Deliberately minimal:
#   * ZERO runtime dependencies (stdlib only) — `dependencies = []` is a
#     contract, enforced by test_packaging.py.
#   * one console script: `einvoice` -> einvoice.cli:main (the same entry
#     point as `python3 -m einvoice` and the source-checkout `einvoice.py`).
#   * ships ONLY the `einvoice` package — the multi-hundred-MB rule corpus,
#     differential harness and test vectors stay in the repo, not the wheel.
#
# Published to PyPI as `verifyhash-einvoice` since 0.2.0 (2026-07-22);
# republishing stays a human-gated step (see REPUBLISH-PYPI.md). Also
# installable from a checkout:  python3 -m pip install /path/to/einvoice

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "verifyhash-einvoice"
version = "0.2.7"
description = "Zero-dependency EN 16931 / XRechnung (UBL + CII) e-invoice conformance validator — 297 business rules including the national BR-DE and BR-DEX CIUS/extension layers, each differential-tested to 0 divergences against the official Schematron within the implemented set; every fireable BR-CL-* code-list check is now implemented in both syntaxes; see CORRECTNESS.md for the honest remaining scope."
# LONG DESCRIPTION — why README.md itself, with ABSOLUTE links (route A).
#
# The rendered PyPI body is the only discovery channel this package has that
# needs no owner action, and up to 0.2.7 it was a 70.7 KB link graph of 49
# RELATIVE markdown links (29 distinct targets) against exactly ONE absolute
# link — and that one went to pre-commit.com. PyPI does not rewrite relative
# markdown targets, so every one of them resolved against pypi.org and led
# nowhere: the reader who wanted CORRECTNESS.md, the document this project's
# whole honest-scope pitch defers to, clicked into a 404.
#
# TWO ROUTES EXISTED. (B) declare a second, PyPI-shaped readme here and keep
# README.md repo-shaped. Rejected: it buys a tighter storefront at the price of
# a 70 KB duplicate that must be GENERATED and drift-gated forever, and this
# tree already carries a stack of generated-copy gates (attestation.json,
# remediation_catalog.json, coverage_matrix.json, the whole www/ surface) —
# one more is real cost for a cosmetic win. (A), taken here: rewrite README.md's own doc links to absolute
# URLs. One document, zero drift surface, and the links then work from EVERY
# render context — pypi.org, a vendored copy, a quoted excerpt — not just from
# a GitHub tree view. Cost, stated honestly: a `git clone` reader can no longer
# click a sibling doc offline, they land on github.com instead. That is the
# smaller loss, because README.md is read on PyPI and on GitHub, not in $EDITOR.
#
# TARGET DISCIPLINE. verifyhash.com pages win over github.com blobs wherever
# both cover the topic (the site is redeployed and byte-equal to committed);
# repo-only material (COVERAGE.md, REPORT-SCHEMA.md, prove.py, ci/…) uses
# .../blob/main/einvoice/…, the same spelling gen_site.py already emits.
#
# THE TWO ABSENT DOCS. `RECEIPT-VERIFICATION.md` and `QUICKSTART.de.md` are in
# the working tree but NOT at `origin/main` (measured this run: `git cat-file -e
# origin/main:einvoice/<f>` -> absent for exactly these two of the 29 targets).
# They are therefore NAMED IN PLAIN TEXT in README.md, never linked — the same
# reasoning that keeps a Changelog entry out of [project.urls] below. Relative
# was not an option either: a relative link is just a 404 with extra steps on
# pypi.org. Link them in the same change that pushes them.
#
# test_packaging.py::StorefrontMetadata pins all of this by parsing the `readme`
# key below rather than assuming the filename, so switching to route B later
# moves the contract with it.
readme = "README.md"
requires-python = ">=3.8"

# LICENCE DECLARATION — why the TABLE form and not PEP 639.
#
# PEP 639 (`license = "Apache-2.0"`, a plain STRING) emits a
# `License-Expression` metadata field and is the modern spelling, but
# setuptools only understands it from 77.0 onward, and it additionally
# FORBIDS the `License :: OSI Approved ::` classifier once used. Adopting it
# would mean raising [build-system] `requires` from `setuptools>=61` to
# `setuptools>=77` — i.e. quietly narrowing who can build this package from a
# source checkout — to gain a metadata field nobody consuming us asks for.
# The floor is a promise, so it stays where it is.
#
# The TABLE form below sets the classic `License:` metadata field, is honoured
# by the declared >=61 floor, still works on the 83.0.0 setuptools this tree
# builds with (deprecated there, with an announced due date of 2027-02-18 —
# revisit before then, together with the floor), and keeps the OSI classifier
# legal. `license-files` under [tool.setuptools] (see below) is the form that
# same >=61 floor honours, so the two declarations agree.
license = {text = "Apache-2.0"}

# The published metadata card said `3 - Alpha` up to and including 0.2.7. That
# was an UNDERCLAIM, and an actively harmful one: "Alpha" is the single word
# that disqualifies a validator from someone's compliance pipeline. Against
# CORRECTNESS.md — in particular §5 "The honest remaining gap", which is the
# most pessimistic statement we make about this engine anywhere — the honest
# reading is Beta: 297 differentially-proven business rules, every one graded
# against the official compiled Schematron; a published, installable wheel; a
# GitHub Action; 148 test files. §5's limits (no XSD validation, no signature
# verification, "corpus, not universe", "not a legal conformance certificate")
# are SCOPE limits, not maturity limits — none of them says the implemented
# engine is unstable, unfinished or unfit to run. `5 - Production/Stable`
# would be the overclaim in the other direction while the API is still free to
# move inside 0.x, so: 4 - Beta.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    # The BR-DE-*/BR-DEX-* XRechnung layer, the German-language pages of the
    # site and the German violation messages are a real part of the product.
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    # Per-minor entries exist to drive PyPI's sidebar version filter; they
    # mirror `requires-python = ">=3.8"` exactly and must be kept in step with
    # it (test_packaging.py asserts the two agree).
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Quality Assurance",
]

# Search terms a buyer actually types. Every one of these names something the
# engine genuinely handles (the two syntaxes, the EN 16931 core, the German
# CIUS, the hybrid PDF containers) — no aspirational terms.
#
# One term is deliberately banned from this whole file, and test_packaging.py
# enforces its absence negatively: the pan-European network's name. What the
# engine vendors is a 21-assert KoSIT-published subset of that network's
# EN 16931 rules, not the network's own ruleset and none of its transport,
# participant-lookup or access-point machinery. CORRECTNESS.md §5 says so
# outright. Using it as a search keyword would sell a capability we do not
# have, to exactly the buyers least able to check.
keywords = [
    "xrechnung",
    "en16931",
    "e-rechnung",
    "zugferd",
    "factur-x",
    "ubl",
    "cii",
    "e-invoicing",
    "conformance",
    "validator",
]

# ZERO runtime dependencies — the whole point. Do not add any.
dependencies = []

[project.urls]
# The PyPI sidebar is the only discovery channel for this package that needs
# no action from anyone, so it links to the pages that answer a visitor's
# actual next question, not just to a repo root. Every URL here was probed and
# returns 200; they use the same base as gen_site.py's BASE_URL
# ("https://verifyhash.com/einvoice"), trailing slash included, so the site
# generator and this file cannot drift into different spellings.
#
# NO Changelog entry, on purpose: `einvoice/CHANGELOG.md` exists in the working
# tree but NOT at `origin/main` (measured this run:
# `git cat-file -e origin/main:einvoice/CHANGELOG.md` -> absent), so a
# .../blob/main/einvoice/CHANGELOG.md link would 404 for every visitor until
# that history is pushed. Add the entry in the same change that pushes it.
Homepage = "https://verifyhash.com/einvoice/"
Documentation = "https://verifyhash.com/einvoice/walkthrough/"
"Why not KoSIT?" = "https://verifyhash.com/einvoice/compare/"
"Browser validator" = "https://verifyhash.com/einvoice/validate/"
"Rule index" = "https://verifyhash.com/einvoice/rules/"
Licensing = "https://verifyhash.com/einvoice/licensing/"
Source = "https://github.com/verifyhash/verifyhash"
Issues = "https://github.com/verifyhash/verifyhash/issues"

[project.scripts]
einvoice = "einvoice.cli:main"

[tool.setuptools]
# Explicit: ship the pure-Python package only (never corpus/, ci/, tests).
packages = ["einvoice"]

# Ship the licence text INSIDE the artifact. Up to 0.2.7 the sdist/wheel
# carried only NOTICE, which then pointed the reader at a LICENSE file the
# distribution did not contain — Apache-2.0 §4(a) asks the opposite. LICENSE
# here is a byte-identical copy of the repo-root LICENSE (asserted by
# test_packaging.py, the same duplicated-artifact pattern already used for
# attestation.json and remediation_catalog.json).
#
# TRAP, and the reason NOTICE is listed explicitly: an explicit license-files
# list REPLACES setuptools' default glob (LICENSE*/NOTICE*/COPYING*/AUTHORS*).
# NOTICE reaches dist-info/licenses/ today only via that default; dropping it
# from this list would silently stop shipping it.
#
# This is the [tool.setuptools] spelling rather than the PEP 639 [project]
# `license-files` key because the latter needs setuptools>=77 and the
# [build-system] floor is >=61 — see the `license` comment in [project].
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
# PEP 561: ship the `py.typed` marker so the embedded type hints are honoured
# by downstream type checkers (mypy/pyright) when einvoice is vendored/installed.
#
# attestation.json: the tiny (~1.8 KB) byte-reproducible conformance-CLAIM
# attestation (rule count, coverage headline, in-scope test-suite pass rates,
# pinned corpus content hashes). Shipping it INSIDE the package means an
# evaluator who runs `pip install verifyhash-einvoice` receives the trust proof
# with the artifact itself, instead of a wheel that carries zero trust data.
# gen_attestation.py writes this copy byte-identically to the top-level
# einvoice/attestation.json from the same serialized bytes; test_attestation.py
# asserts the two never diverge. The heavy corpus/, ci/, tests and the 276 KB
# coverage_matrix.json deliberately stay OUT of the wheel (packages =
# ["einvoice"] ships the package dir only).
#
# remediation_catalog.json: an installed wheel must carry ACTIONABLE fix
# guidance, not just rule ids. einvoice.report relays the catalog's title /
# fix_hint / terms / location into every violation record (the fields
# report.schema.json advertises); without the catalog in the wheel those come
# back null/empty and a `pip install` user is told a rule broke with nothing to
# fix it with. It is the one heavy-ish exception, and it earns it: 502 KB raw
# but ~35 KB gzipped (measured: 34,882 bytes) against a ~311 KB wheel — and it
# must be a file, not a fetch, because zero-dependency OFFLINE operation is
# what the compare page sells. gen_remediation.py writes this copy
# byte-identically to the top-level einvoice/remediation_catalog.json from the
# same serialized bytes; test_remediation_catalog.py asserts they never diverge.
einvoice = ["py.typed", "attestation.json", "remediation_catalog.json"]
